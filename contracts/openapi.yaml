openapi: 3.1.0
info:
  title: Полка — API
  version: 2.4.2
  description: Полка 2.4.2. Обязательно только название; остальные характеристики необязательны. Проверка галочкой
    сохраняет значение, OCR переносится отдельным действием. Устаревшие required/required_fields игнорируются. LLM
    опциональна, сохранение и финальное подтверждение раздельны.
servers:
- url: /
  description: Тот же адрес и порт, с которого открыт API; поддерживает HTTPS.
security:
- SessionCookie: []
paths:
  /health/live:
    get:
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503': &id001
          $ref: '#/components/responses/Error'
  /api/v1/jobs:
    post:
      operationId: createJob
      security: []
      description: 'Создаёт сессию при отсутствии cookie. files: 1–3 JPEG/PNG, до 5 MiB каждый. initial_data — JSON-строка
        по InitialData; не JSON body. Ограничения пикселей и суммарного размера см. PRODUCT.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  minItems: 1
                  maxItems: 3
                initial_data:
                  type: string
                  contentMediaType: application/json
                  description: JSON по схеме InitialData, по умолчанию {}
                  default: '{}'
              required:
              - files
      responses:
        '202':
          description: Поставлено в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          headers:
            Set-Cookie:
              description: card_session; HttpOnly; SameSite=Lax; Secure для HTTPS
              schema: &id003
                type: string
        '413': *id001
        '415': *id001
        '422': *id001
        '429': *id001
        '503': *id001
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/jobs/{job_id}:
    parameters:
    - name: job_id
      in: path
      required: true
      schema: &id002
        type: string
        minLength: 1
    get:
      operationId: getJob
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404': *id001
  /api/v1/cards/{card_id}:
    parameters:
    - name: card_id
      in: path
      required: true
      schema: *id002
    get:
      operationId: getCard
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404': *id001
    patch:
      operationId: patchCard
      description: Сервер создаёт user_input источники, обновляет ревизию и пересчитывает проверки. Нельзя задавать
        scores/state/confirmation напрямую.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCard'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404': *id001
        '409': *id001
        '422': *id001
        '403':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteCard
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDeleted'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: card_id
        in: path
        required: true
        schema: &id011
          type: string
          minLength: 1
      - name: expected_revision
        in: query
        required: true
        schema: &id012
          type: integer
          minimum: 1
      description: Удаление товара, его подсказок и неиспользуемых фото. Требует текущую ревизию и сессию. Активный
        OCR блокирует удаление (409).
  /api/v1/cards/{card_id}/confirm:
    parameters:
    - name: card_id
      in: path
      required: true
      schema: *id002
    post:
      operationId: confirmCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmCard'
      description: Принимает текущую ready_to_confirm ревизию. Успех увеличивает revision и сохраняет confirmed_revision.
        Повтор подтверждённой текущей ревизии идемпотентен.
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404': *id001
        '409': *id001
        '422': *id001
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/cards/{card_id}/export:
    parameters:
    - name: card_id
      in: path
      required: true
      schema: *id002
    get:
      operationId: exportCard
      description: Только confirmed текущей сессии. format=text возвращает проверенное описание без технических
        источников; json сохраняет полный интеграционный контракт.
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
            text/plain:
              schema:
                type: string
          headers:
            Content-Disposition:
              schema: *id003
              description: attachment; filename="product-card.json"
        '404': *id001
        '409': *id001
      parameters:
      - name: format
        in: query
        schema:
          type: string
          enum:
          - json
          - text
          default: json
  /api/v1/photos/{photo_id}:
    parameters:
    - name: photo_id
      in: path
      required: true
      schema: *id002
    get:
      operationId: getPhoto
      responses:
        '200':
          description: Фото своей сессии
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404': *id001
  /api/v1/cards/{card_id}/description-template:
    post:
      operationId: regenerateDescription
      description: Пересобрать описание только из принятых полей. Сбрасывает подтверждение и увеличивает ревизию.
      parameters:
      - name: card_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmCard'
      responses:
        '200':
          description: Обновлённая карточка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/config:
    get:
      operationId: getConfig
      security: []
      responses:
        '200':
          description: Общие подписи и режим обработки
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  labels:
                    type: object
                    additionalProperties: &id004
                      type: string
                  required_total:
                    const: 1
                  processing: *id004
                  classifier: *id004
                  ocr_modes:
                    type: array
                    items:
                      $ref: '#/components/schemas/OCRMode'
                  attribute_catalog:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        field_id: &id014
                          type: string
                          pattern: ^[a-z][a-z0-9_]{0,63}$
                        label: &id013
                          type: string
                          minLength: 1
                      required:
                      - field_id
                      - label
                  llm:
                    $ref: '#/components/schemas/LLMConfig'
                required:
                - labels
                - required_total
                - processing
                - classifier
                - ocr_modes
                - attribute_catalog
                - llm
  /api/v1/templates:
    get:
      operationId: listTemplates
      description: Каталог версий шаблонов без товарных фактов и профили категорий из серверного домена.
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateCatalog'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/templates/{template_id}:
    get:
      operationId: getTemplate
      description: 'Точная версия шаблона. Неизвестный ID или версия: 404.'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTemplate'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
      parameters:
      - name: template_id
        in: path
        required: true
        schema: &id005
          type: string
          minLength: 1
      - name: version
        in: query
        required: true
        schema: &id006
          type: integer
          minimum: 1
      security: []
  /api/v1/cards/{card_id}/preview:
    get:
      operationId: previewCard
      description: 'Приватная read-only проекция точной ревизии. Все шаблоны универсальны. Неизвестная версия шаблона:
        404. Не подтверждает карточку. warnings содержит все текущие Issue, включая blocker.'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPreview'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      parameters:
      - &id007
        name: card_id
        in: path
        required: true
        schema: *id005
      - &id008
        name: template_id
        in: query
        required: true
        schema: *id005
      - &id009
        name: template_version
        in: query
        required: true
        schema: *id006
      - &id010
        name: expected_revision
        in: query
        required: true
        schema: *id006
  /api/v1/cards/{card_id}/preview.html:
    get:
      operationId: previewCardHtml
      description: Экранированный самостоятельный HTML той же проекции. Фото требуют ту же cookie; публичная ссылка
        не создаётся. No-store.
      responses:
        '200':
          description: Успех
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      parameters:
      - *id007
      - *id008
      - *id009
      - *id010
      - name: palette
        in: query
        required: false
        schema:
          type: string
          enum:
          - strata
          - ocean
          - sage
          - clay
          default: strata
  /api/v1/cards/{card_id}/recommendations:
    get:
      operationId: getCardRecommendations
      description: 'Действия по сохранённым сведениям и последнему успешному OCR-анализу точного набора фото. photo_analysis
        содержит задачу, время запуска, фото и диагностические замечания; null, если актуального результата нет.
        Только чтение: факты, ревизия, подтверждение и readiness сохранённой карточки не меняются.'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardRecommendations'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      parameters:
      - name: card_id
        in: path
        required: true
        schema: *id005
      - name: expected_revision
        in: query
        required: true
        schema: *id006
  /api/v1/version:
    get:
      operationId: getVersionInfo
      description: Версия реально запущенного backend и доступность функций в API и редакторе. Не содержит путей
        установки.
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
      security: []
  /api/v1/cards/{card_id}/ocr-review:
    get:
      operationId: getOCRReview
      description: 'Приватный отбор OCR-строк точной ревизии: useful/other/doubtful, точные повторы объединены.
        Исходные Source и карточка не меняются. Отбор по правилам не подтверждает факты и не восстанавливает текст.'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OCRReview'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      parameters:
      - name: card_id
        in: path
        required: true
        schema: *id005
      - name: expected_revision
        in: query
        required: true
        schema: *id006
  /api/v1/cards:
    post:
      operationId: createManualCard
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualCardCreate'
      description: Пустой ручной черновик без OCR и фотографий. Создаёт приватную сессию, модель не требуется; исходные
        значения непроверенные.
    get:
      operationId: listCards
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardList'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      description: Список неистёкших товаров текущей приватной сессии. Внутренние OCR-результаты не включаются.
        Карточки хранятся 24 часа по умолчанию.
  /api/v1/cards/{card_id}/photos:
    post:
      operationId: attachCardPhotos
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: card_id
        in: path
        required: true
        schema: *id011
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                expected_revision: *id012
                files:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: string
                    format: binary
              required:
              - expected_revision
              - files
      description: Добавить фото без запуска модели; максимум три. expected_revision защищает правки. Снимает подтверждение.
  /api/v1/cards/{card_id}/ocr-jobs:
    post:
      operationId: createSuggestionJob
      responses:
        '202':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: card_id
        in: path
        required: true
        schema: *id011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionJobCreate'
      description: Явно запустить local/api по прикреплённым фото. Результат отдельный, рабочая карточка не меняется.
        Только api передаёт фото Google.
  /api/v1/cards/{card_id}/ocr-suggestions:
    get:
      operationId: getCardSuggestions
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSuggestions'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: card_id
        in: path
        required: true
        schema: *id011
      - name: job_id
        in: query
        required: true
        schema: *id011
  /api/v1/cards/{card_id}/accept-suggestion:
    post:
      operationId: acceptCardSuggestion
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: card_id
        in: path
        required: true
        schema: *id011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptSuggestion'
      description: Принять ровно одну существующую строку с её настоящими источниками. Значение вычисляет сервер;
        произвольный текст/score не принимается. Заполненное поле требует replace_existing=true; поле остаётся непроверенным.
        Истёкшая/чужая задача недоступна.
  /api/v1/cards/{card_id}/text-assistance:
    post:
      operationId: text_assistance
      parameters:
      - name: card_id
        in: path
        required: true
        schema: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextAssistanceRequest'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextAssistance'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/cards/{card_id}/apply-text-assistance:
    post:
      operationId: apply_text_assistance
      parameters:
      - name: card_id
        in: path
        required: true
        schema: *id013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyTextAssistance'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: card_session
  schemas:
    Confidence:
      type: object
      additionalProperties: false
      properties:
        value:
          type: number
          minimum: 0
          maximum: 100
        kind:
          type: string
          enum:
          - ocr_native_0_1
          - ocr_native_0_100
          - ocr_aggregate
          - classifier_score
        provider:
          type: string
          minLength: 1
        calibrated:
          type: boolean
      required:
      - value
      - kind
      - provider
      - calibrated
      allOf:
      - if:
          properties:
            kind:
              enum:
              - ocr_native_0_1
              - ocr_aggregate
              - classifier_score
        then:
          properties:
            value:
              maximum: 1
    Photo:
      type: object
      additionalProperties: false
      properties:
